packages:
  - apps/*
  - packages/*

# pnpm blocks dependency build scripts by default; list explicit decisions here.
allowBuilds:
  # Ship prebuilt binaries; install scripts not needed.
  '@parcel/watcher': false
  unrs-resolver: false
  # Browser autoinit defaults / CLI version check; not needed on the server.
  '@firebase/util': false
  protobufjs: false
  # Downloads the schema engine used by `prisma migrate`.
  '@prisma/engines': true
  prisma: true

# pnpm holds back packages published <1 day ago. These are first-party Expo SDK 57
# patches pinned by `expo install`; review this list when upgrading.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
  - '@expo/metro-runtime@57.0.17'
  - '@expo/ui@57.0.24'
  - expo-linking@57.0.13
  - expo-router@57.0.27
